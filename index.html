<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini chatt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <h1>Normalito-General</h1>
      <span class="status">🟢 En línea</span>
    </header>

    <!-- ESTE SERÍA EL CONTENEDOR PRINCIPAL LENS -->
    <div class="main">

      <!-- CHAT -->
      <div class="chat">

        <!-- MENSAJES -->
        <div class="messages" id="messages">

          <!-- Mensaje ejemplo -->
          <div class="message">
            <span class="user">Usuario1</span>
            <p>Hola 👋</p>
          </div>

          <!-- Mensaje tipo audio -->
          <div class="message audio">
            <span class="user">Usuario2</span>
            <div class="audio-bar">
              ▶️ ━━━━━━━ 0:08
            </div>
          </div>
        </div>

        <!-- INPUT, esto es para el texto -->
        <div class="input-area">
          <button id="recordBtn"><img src="imagenes/Icono Grabar Audio.png" alt="Grabar"></button>
          <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
          <button id="sendBtn"><img src="imagenes/Icono Subir.png" alt="Enviar"></button>
        </div>

      </div>

      <!-- SIDEBAR USUARIOS -->
      <aside class="users">
        <h2>Usuarios</h2>

        <ul id="userList">
          <li>Usuario1</li>
          <li>Usuario2</li>
          <li>Usuario3</li>
        </ul>

      </aside>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
