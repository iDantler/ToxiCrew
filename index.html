<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini chatt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <h1>Normalito-General</h1>
      <span class="status">🟢 En línea</span>
    </header>

    <!-- ESTE SERÍA EL CONTENEDOR PRINCIPAL LENS -->
    <div class="main">

      <!-- CHAT -->
      <div class="chat">

        <!-- MENSAJES -->
        <div class="messages" id="messages">

        </div>

        <!-- INPUT, esto es para el texto -->
        <div class="inputArea">
          <button id="recordBtn"><img src="imagenes/Icono Grabar Audio.png" alt="Grabar"></button>
          <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
          <button id="sendBtn"><img src="imagenes/Icono Subir.png" alt="Enviar"></button>
        </div>

      </div>

      <!-- SIDEBAR USUARIOS -->
      <aside class="users">
        <h2>Usuarios</h2>

        <ul id="userList">
          <li>Usuario1</li>
          <li>Usuario2</li>
          <li>Usuario3</li>
        </ul>

      </aside>

    </div>

  </div>

  <script src="enviarMensaje.js"></script>
  <script type="module" src="grabarAudio.js"></script>

</body>
</html>
