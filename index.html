<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini chatt</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <h1>Normalito-General</h1>
      <span class="status">🟢 En línea</span>
    </header>

    <!-- ESTE SERÍA EL CONTENEDOR PRINCIPAL LENS -->
    <div class="main">

      <!-- CHAT -->
      <div class="chat">

        <!-- MENSAJES -->
        <div class="messages" id="messages">

        </div>

        <!-- INPUT, esto es para el texto -->
        <div class="inputArea">
          <button id="recordBtn"><img src="imagenes/Icono Grabar Audio.png" alt="Grabar"></button>
          <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
          <button id="sendBtn"><img src="imagenes/Icono Subir.png" alt="Enviar"></button>
        </div>

      </div>

      <!-- SIDEBAR USUARIOS -->
      <aside class="users">
        <h2>Usuarios</h2>

        <ul id="userList">
          <li>Usuario1</li>
          <li>Usuario2</li>
          <li>Usuario3</li>
        </ul>

      </aside>

    </div>

  </div>

  <script src="enviarMensaje.js"></script>
  <script type="module" src="animacionAudios.js"></script>

  <!-- Script para manejar usuarios básicos -->
  <script>
    // Creamos un ID único para cada usuario si no tiene uno
    let userId = localStorage.getItem('userId');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('userId', userId);
    }
    console.log('Usuario ID:', userId);

    // Aquí podríamos poner lógica para banear, como chequear una lista de baneados
    // const bannedUsers = ['user_abc123']; // IDs de los baneados
    // if (bannedUsers.includes(userId)) {
    //   alert('Estás baneado');
    //   // Desactivar cosas
    // }
  </script>

</body>
</html>
